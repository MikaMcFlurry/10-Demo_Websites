<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="dj-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  <!-- Vinyl record -->
  <circle cx="100" cy="105" r="70" fill="#1a1a2e"/>
  <circle cx="100" cy="105" r="65" fill="none" stroke="#2a2a4e" stroke-width="1"/>
  <circle cx="100" cy="105" r="55" fill="none" stroke="#2a2a4e" stroke-width="0.5"/>
  <circle cx="100" cy="105" r="45" fill="none" stroke="#2a2a4e" stroke-width="0.5"/>
  <circle cx="100" cy="105" r="35" fill="none" stroke="#2a2a4e" stroke-width="1"/>
  <!-- Record grooves -->
  <circle cx="100" cy="105" r="60" fill="none" stroke="#333355" stroke-width="0.3"/>
  <circle cx="100" cy="105" r="50" fill="none" stroke="#333355" stroke-width="0.3"/>
  <circle cx="100" cy="105" r="40" fill="none" stroke="#333355" stroke-width="0.3"/>
  <!-- Center label -->
  <circle cx="100" cy="105" r="18" fill="#e94560"/>
  <circle cx="100" cy="105" r="4" fill="#1a1a2e"/>
  <!-- Light reflection arc -->
  <path d="M 60 75 Q 80 60, 110 70" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
  <!-- Headphones -->
  <path d="M 55 55 Q 55 20, 100 18 Q 145 20, 145 55" fill="none" stroke="#e94560" stroke-width="6" stroke-linecap="round"/>
  <!-- Left ear cup -->
  <rect x="42" y="48" width="20" height="28" rx="6" fill="#e94560"/>
  <rect x="46" y="52" width="12" height="20" rx="4" fill="#1a1a2e"/>
  <!-- Right ear cup -->
  <rect x="138" y="48" width="20" height="28" rx="6" fill="#e94560"/>
  <rect x="142" y="52" width="12" height="20" rx="4" fill="#1a1a2e"/>
  <!-- Music notes -->
  <text x="160" y="150" font-family="serif" font-size="28" fill="#e94560" opacity="0.8">&#9835;</text>
  <text x="30" y="160" font-family="serif" font-size="20" fill="#e94560" opacity="0.6">&#9833;</text>
</svg>
