<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a7a6a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3a9a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a7d7c5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4efe5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" />
  <!-- Inner circle ring -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="#a7d7c5" stroke-width="2" opacity="0.5" />
  <!-- Stylized person in motion -->
  <!-- Head -->
  <circle cx="105" cy="52" r="14" fill="#ffffff" />
  <!-- Body / Torso - curved to suggest movement -->
  <path d="M105 66 C102 80, 95 95, 90 110" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round" />
  <!-- Left arm reaching up/back -->
  <path d="M100 78 C88 68, 75 62, 65 55" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" />
  <!-- Right arm reaching forward -->
  <path d="M100 80 C112 75, 125 72, 138 68" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" />
  <!-- Left leg stepping forward -->
  <path d="M90 110 C82 125, 72 138, 62 150" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" />
  <!-- Right leg back -->
  <path d="M92 108 C100 122, 112 135, 122 148" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" />
  <!-- Motion arc lines -->
  <path d="M45 85 C42 75, 44 62, 52 52" stroke="#a7d7c5" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8" />
  <path d="M38 92 C34 78, 37 62, 48 48" stroke="#a7d7c5" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5" />
  <!-- Small wellness/energy dots -->
  <circle cx="148" cy="58" r="3" fill="#a7d7c5" opacity="0.8" />
  <circle cx="155" cy="50" r="2" fill="#a7d7c5" opacity="0.6" />
  <circle cx="145" cy="48" r="2.5" fill="#a7d7c5" opacity="0.7" />
</svg>
