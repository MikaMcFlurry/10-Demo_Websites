<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="coach-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a2c6a"/>
      <stop offset="100%" style="stop-color:#6a3c8a"/>
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="100" cy="100" r="90" fill="url(#coach-grad)"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#e8a838" stroke-width="2" opacity="0.4"/>
  <!-- Compass / Star shape representing direction -->
  <polygon points="100,35 108,80 150,80 115,105 130,150 100,120 70,150 85,105 50,80 92,80" fill="#e8a838" opacity="0.9"/>
  <!-- Person silhouette -->
  <circle cx="100" cy="68" r="10" fill="#ffffff"/>
  <path d="M100 78 C96 95, 92 110, 90 125" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M90 125 L80 150" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M92 122 L105 148" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Arrow pointing up-right (growth) -->
  <line x1="130" y1="60" x2="155" y2="35" stroke="#e8a838" stroke-width="4" stroke-linecap="round"/>
  <polyline points="145,35 155,35 155,45" fill="none" stroke="#e8a838" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
