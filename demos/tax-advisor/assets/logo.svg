<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a4060;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b7fa5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8aabc8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer circle -->
  <circle cx="60" cy="60" r="58" fill="url(#shieldGrad)" stroke="#5b7fa5" stroke-width="2"/>
  <!-- Inner circle ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#5b7fa5" stroke-width="1" opacity="0.4"/>
  <!-- Shield shape -->
  <path d="M60 18 L88 32 L88 58 C88 78 74 92 60 100 C46 92 32 78 32 58 L32 32 Z" fill="url(#accentGrad)" opacity="0.25" stroke="#5b7fa5" stroke-width="1.5"/>
  <!-- Balanced scales -->
  <!-- Center pillar -->
  <line x1="60" y1="38" x2="60" y2="78" stroke="#8aabc8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Base -->
  <line x1="48" y1="78" x2="72" y2="78" stroke="#8aabc8" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top beam -->
  <line x1="38" y1="45" x2="82" y2="45" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Fulcrum triangle -->
  <polygon points="56,38 64,38 60,32" fill="#ffffff" opacity="0.9"/>
  <!-- Left pan strings -->
  <line x1="38" y1="45" x2="33" y2="62" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="45" x2="43" y2="62" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Left pan -->
  <path d="M30 62 Q38 68 46 62" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Right pan strings -->
  <line x1="82" y1="45" x2="77" y2="62" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="82" y1="45" x2="87" y2="62" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Right pan -->
  <path d="M74 62 Q82 68 90 62" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
