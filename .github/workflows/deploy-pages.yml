name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/github-pages-business-demos-ZhnfF
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            sites/greencart-nuxt/package-lock.json
            sites/aurorametrics-nextjs/package-lock.json
            sites/lumen-atelier-astro/package-lock.json

      - name: Create output directory
        run: mkdir -p ./pages-dist

      # ── GreenCart (Nuxt 3) ─────────────────────────────────────────────────
      - name: Install GreenCart dependencies
        working-directory: sites/greencart-nuxt
        run: npm ci

      - name: Build GreenCart
        working-directory: sites/greencart-nuxt
        run: npm run generate

      - name: Copy GreenCart output
        run: cp -r sites/greencart-nuxt/.output/public ./pages-dist/greencart

      # ── AuroraMetrics (Next.js) ────────────────────────────────────────────
      - name: Install AuroraMetrics dependencies
        working-directory: sites/aurorametrics-nextjs
        run: npm ci

      - name: Build AuroraMetrics
        working-directory: sites/aurorametrics-nextjs
        run: npm run build

      - name: Copy AuroraMetrics output
        run: cp -r sites/aurorametrics-nextjs/out ./pages-dist/aurorametrics

      # ── Lumen Atelier (Astro) ──────────────────────────────────────────────
      - name: Install Lumen Atelier dependencies
        working-directory: sites/lumen-atelier-astro
        run: npm ci

      - name: Build Lumen Atelier
        working-directory: sites/lumen-atelier-astro
        run: npm run build

      - name: Copy Lumen Atelier output
        run: cp -r sites/lumen-atelier-astro/dist ./pages-dist/lumen-atelier

      # ── Root index + static demo sites ────────────────────────────────────
      - name: Copy root index and demos
        run: |
          cp index.html ./pages-dist/index.html
          cp impressum.html ./pages-dist/impressum.html
          cp datenschutz.html ./pages-dist/datenschutz.html
          cp -r portfolio-assets ./pages-dist/portfolio-assets
          cp -r demos ./pages-dist/demos
          cp -r stimmzettel ./pages-dist/stimmzettel

      # ── Schaustücke (statisch, kein Build) ────────────────────────────────
      - name: Copy showcase sites
        run: cp -r showcase ./pages-dist/showcase

      # ── Sammlung C: Ableitungen aus der Mika UX Library ───────────────────
      - name: Copy Mika UX Library sites
        run: cp -r mika-ux ./pages-dist/mika-ux

      - name: Validate static showcase
        run: node scripts/validate-static-showcase.mjs ./pages-dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-dist

  # Die Pages-Umgebung nimmt Deployments nur vom Default-Branch an. Auf
  # Arbeitsbranches läuft deshalb nur der Build — der prüft Framework-Builds
  # und Validator und ist genau das, was dort gebraucht wird. Ohne diese
  # Bedingung scheiterte der Deploy-Job dort nach einer Sekunde und färbte
  # jeden Push rot, obwohl nichts kaputt war.
  deploy:
    if: github.ref == 'refs/heads/claude/github-pages-business-demos-ZhnfF'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
